# 发布工作流：把某次 "Build app packages" 运行的全部安装包发布到同一个 GitHub Release。
# 当前只构建全剧视界（quanjushijie）安卓 arm64 版，缺少时发布失败。
name: Publish release

on:
  # 手动发布：填写包含构建产物的 run id，标签留空则取 pubspec.yaml 的版本号。
  workflow_dispatch:
    inputs:
      run_id:
        description: '包含构建产物的 Actions run id'
        required: true
      tag:
        description: 'Release 标签，留空使用 pubspec.yaml 版本'
        required: false
  # 主分支或 v* 标签构建成功后自动发布。
  workflow_run:
    workflows: ['Build app packages']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && (
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release tag
        id: tag
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            version=$(sed -n 's/^version:[[:space:]]*\([0-9][^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)
            if [ -z "$version" ]; then
              echo 'pubspec.yaml 缺少版本号' >&2
              exit 1
            fi
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布标签：$tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Collect packages
        run: |
          mkdir -p packages
          find dist -type f \
            \( -name '*.apk' \
            -o -name '*-windows-x64-portable.zip' \
            -o -name '*-windows-x64-setup.exe' \
            -o -name '*-macos.zip' \
            -o -name '*.ipa' \
            -o -name 'guoappweb.zip' \) \
            -exec cp -f {} packages/ \;
          ls -l packages

      - name: Verify quanjushijie package is present
        run: |
          missing=0
          for edition in quanjushijie; do
            count=$(find packages -maxdepth 1 -type f -name "$edition-*" | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$edition 没有可发布的构建产物"
              missing=1
            else
              echo "$edition：$count 个安装包"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" -R ${{ github.repository }} > /dev/null 2>&1; then
            gh release edit "$TAG" -R ${{ github.repository }} --title "全剧视界 $TAG"
          else
            gh release create "$TAG" -R ${{ github.repository }} \
              --title "全剧视界 $TAG" \
              --notes "全剧视界（quanjushijie）安卓 arm64 APK。"
          fi
          FILES=$(find packages -maxdepth 1 -type f | sort)
          if [ -z "$FILES" ]; then
            echo '没有可上传的文件' >&2
            exit 1
          fi
          gh release upload "$TAG" -R ${{ github.repository }} $FILES --clobber

      - name: Release summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## 已发布 $TAG"
            echo
            echo '| 版本 | 安装包 |'
            echo '| --- | --- |'
            for file in $(find packages -maxdepth 1 -type f | sort); do
              echo "| $(basename "$file" | cut -d- -f1) | $(basename "$file") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
